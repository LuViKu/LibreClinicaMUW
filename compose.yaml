# LibreClinica MUW Ophthalmology — local development stack
# Department of Ophthalmology and Optometry, Medical University of Vienna
name: libreclinica-muw

services:
  libreclinica:
    build: .
    image: libreclinica-muw:dev
    ports:
      # Dev binds loopback (default). Production publishes on a routable
      # interface for the separate-host reverse proxy by setting
      # LIBRECLINICA_BIND_ADDR=0.0.0.0 in /etc/libreclinica/env. This is the
      # SINGLE source of truth for the bind — do NOT add a second ports entry
      # in an overlay file: Compose *concatenates* ports lists across files,
      # which produces a conflicting double-bind on 8080 and publishes nothing.
      - "${LIBRECLINICA_BIND_ADDR:-127.0.0.1}:8080:8080"
    depends_on:
      - db
    # Phase D.3 (DR-014): forward libreclinica.sso.* env vars from the
    # host shell so deployments can flip SSO on/off and override
    # institutional defaults (provider name, trusted-proxy CIDRs,
    # button label, etc.) without rebuilding the image. All keys
    # default to safe values in application.yml; the `:-` fallbacks
    # here let `docker compose up` work with none set on the host.
    environment:
      LIBRECLINICA_SSO_ENABLED: "${LIBRECLINICA_SSO_ENABLED:-false}"
      LIBRECLINICA_SSO_PRINCIPAL_HEADER: "${LIBRECLINICA_SSO_PRINCIPAL_HEADER:-REMOTE_USER}"
      LIBRECLINICA_SSO_EMAIL_HEADER: "${LIBRECLINICA_SSO_EMAIL_HEADER:-mail}"
      LIBRECLINICA_SSO_DISPLAY_NAME_HEADER: "${LIBRECLINICA_SSO_DISPLAY_NAME_HEADER:-displayName}"
      LIBRECLINICA_SSO_PROVIDER: "${LIBRECLINICA_SSO_PROVIDER:-shibboleth-meduniwien}"
      LIBRECLINICA_SSO_PROVISIONING: "${LIBRECLINICA_SSO_PROVISIONING:-LOOKUP_ONLY}"
      LIBRECLINICA_SSO_DEFAULT_ROLE: "${LIBRECLINICA_SSO_DEFAULT_ROLE:-ROLE_USER}"
      LIBRECLINICA_SSO_TRUSTED_CIDRS: "${LIBRECLINICA_SSO_TRUSTED_CIDRS:-127.0.0.1/32,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}"
      LIBRECLINICA_SSO_ENTRY_URL: "${LIBRECLINICA_SSO_ENTRY_URL:-/sso/login}"
      LIBRECLINICA_SSO_BUTTON_LABEL: "${LIBRECLINICA_SSO_BUTTON_LABEL:-Sign in with Institutional Account}"
      LIBRECLINICA_SSO_DELEGATE_MFA: "${LIBRECLINICA_SSO_DELEGATE_MFA:-true}"
      LIBRECLINICA_SSO_REAUTH: "${LIBRECLINICA_SSO_REAUTH:-false}"
      # In-app bug-report mail destination (Phase E). Empty by default;
      # set on the host to wire BugReportApiController to a real inbox.
      LIBRECLINICA_BUG_REPORT_RECIPIENT: "${LIBRECLINICA_BUG_REPORT_RECIPIENT:-}"
      # Phase E.5 chronic CI fix (2026-06-03): runs the demo-data
      # Liquibase changesets (M-001..M-007 subjects + CRFs +
      # discrepancy notes + demo users physician/monitor) on dev
      # compose only. Production deployments leave this unset so the
      # WAR boots against a clean schema. CI integration-tests also
      # leave it unset so legacy DBUnit DAO tests aren't blocked by
      # the seed's dn_item_data_map FK rows.
      LIQUIBASE_CONTEXTS: "${LIQUIBASE_CONTEXTS:-demo}"
    volumes:
      # E2E uploads — the Java RetinalInferenceApiController writes the
      # received .e2e here, and the retinal-inference sidecar reads it
      # back through the same in-container path. The host bind makes
      # the two containers share the file via ./docker/e2e-uploads/.
      - ./docker/e2e-uploads:/var/lib/libreclinica/e2e-uploads
      # DR-022: retinal artifact store — the preprocess sidecar writes the
      # per-source-scan companion files under bscans/<e2eUuid>/ and the run
      # branch persists segmentation outputs under segs/<jobUuid>/ here.
      # The viewer's artifact-stream endpoint reads them back. Shared with
      # the retinal-preprocess service at the same in-container path.
      - ./docker/retinal-artifacts:/var/lib/libreclinica/retinal-artifacts
    develop:
      watch:
        # restart on config file changes
        - action: sync+restart
          path: ./docker/config
          target: /usr/local/tomcat/libreclinica.config

        # rebuild on source file changes
        - action: rebuild
          path: ./core

        - action: rebuild
          path: ./odm

        - action: rebuild
          path: ./web
        # ws/ module removed in PR #31; nothing to watch there any more.

  db:
    image: docker.io/library/postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: clinica
      POSTGRES_USER: clinica
      POSTGRES_DB: libreclinica
    # Named volume so the in-browser install (first-run wizard,
    # sysadmin account, sample study) survives `docker compose down`.
    # Without it, every smoke run starts on an empty user_account
    # table and login lands on /pages/login/login. Wipe via:
    #   docker compose down -v
    volumes:
      - libreclinica-db-data:/var/lib/postgresql/data

  smtp:
    image: docker.io/marlonb/mailcrab:v1.1.0
    ports:
      - "127.0.0.1:1080:1080"

  # Phase E.7 (2026-06-10): retinal inference sidecar.
  # FastAPI sync /screen + Postgres-as-queue background worker (single
  # container, two sibling processes). v1 ships the deterministic
  # PlaceholderAdapter — flip RETINAL_INFERENCE_ADAPTER=mirage once the
  # real MIRAGE-based model lands. Task-agnostic by design; v1 enables
  # task='ga' only (geographic atrophy / cRORA segmentation).
  retinal-inference:
    build: ./retinal-inference
    # Explicit `image:` tag — without it `docker compose up --no-build`
    # looks up the auto-generated `<project_name>-<service_name>:latest`
    # (`libreclinica-muw-retinal-inference:latest`) but `docker buildx
    # bake` only stores the build output by digest unless the target has
    # a name. Mirrors what the `libreclinica` service already has
    # (`image: libreclinica-muw:dev` above) so the CI workflow's bake
    # step can pre-load both images for `compose up --no-build`.
    image: libreclinica-muw-retinal-inference:latest
    container_name: libreclinica-muw-retinal-inference-1
    # DR-022 split topology: no hard dep on Postgres. The institutional
    # dev compose still brings db up via the libreclinica service's
    # depends_on; the GPU host omits libreclinica + db entirely and runs
    # this service standalone with RETINAL_INFERENCE_WORKER_ENABLED=false.
    environment:
      RETINAL_INFERENCE_INFERENCE_ADAPTER: ${RETINAL_INFERENCE_ADAPTER:-placeholder}
      # DR-022: institutional dev compose runs the DB-poll worker (default
      # true); GPU host sets this to false to serve POST /run only.
      RETINAL_INFERENCE_WORKER_ENABLED: ${RETINAL_INFERENCE_WORKER_ENABLED:-true}
      # Per-job runner timeout (urllib HTTP, seconds). Default 900s (15 min) is
      # generous on production GPUs but tight under linux/amd64 emulation on
      # Apple Silicon, where the 5-fold ONL ensemble (97 B-scans × 5 models)
      # takes 15-25 min. Bumped to 1 hour for the dev compose so a smoke run
      # doesn't false-timeout.
      RETINAL_INFERENCE_RUNNER_TIMEOUT_S: ${RETINAL_INFERENCE_RUNNER_TIMEOUT_S:-3600}
      RETINAL_INFERENCE_DB_URL: postgresql://clinica:clinica@db:5432/libreclinica
      RETINAL_INFERENCE_SHARED_STORAGE_PATH: /var/lib/libreclinica/segmentation-output
      RETINAL_INFERENCE_E2E_UPLOADS_PATH: /var/lib/libreclinica/e2e-uploads
      # Per-task model-runner endpoints (used when ADAPTER=optima). A task is
      # only enabled when its URL is set; harmless under the placeholder.
      RETINAL_INFERENCE_RUNNER_FLUID_URL: ${RETINAL_INFERENCE_RUNNER_FLUID_URL:-http://retinal-runner-fluid:8000}
      RETINAL_INFERENCE_RUNNER_ONL_URL: ${RETINAL_INFERENCE_RUNNER_ONL_URL:-http://retinal-runner-onl:8000}
      RETINAL_INFERENCE_RUNNER_PR_URL: ${RETINAL_INFERENCE_RUNNER_PR_URL:-http://retinal-runner-pr:8000}
      # GA is gated: empty by default so OptimaAdapter.supports('ga') is False.
      # Set it (+ start the retinal-runner-ga service via the `ga` profile) only
      # on a GPU host with the IOWA binary + .sif available.
      RETINAL_INFERENCE_RUNNER_GA_URL: ${RETINAL_INFERENCE_RUNNER_GA_URL:-}
      # DR-022: stateless POST /run. Disabled by default so single-host dev
      # compose runs the legacy /screen + DB-poll surface only. Set
      # RETINAL_INFERENCE_RUN_ENDPOINT_ENABLED=true + RETINAL_INFERENCE_AUTH_TOKEN
      # on the GPU host to expose /run to the institutional Tomcat.
      RETINAL_INFERENCE_RUN_ENDPOINT_ENABLED: ${RETINAL_INFERENCE_RUN_ENDPOINT_ENABLED:-false}
      RETINAL_INFERENCE_AUTH_TOKEN: ${RETINAL_INFERENCE_AUTH_TOKEN:-}
      RETINAL_INFERENCE_SHARED_TMPDIR: /var/lib/retinal-inference/tmp
    volumes:
      - ./docker/retinal-inference-storage:/var/lib/libreclinica/segmentation-output
      # DR-022: shared tempdir bind so the sidecar's /run TemporaryDirectory is
      # visible to every runner at the same absolute path. Stays empty between
      # requests (sidecar nukes its tempdir on response).
      - ./docker/retinal-tmp:/var/lib/retinal-inference/tmp
      - ./docker/e2e-uploads:/var/lib/libreclinica/e2e-uploads:ro
    cpus: "4.0"
    mem_limit: 4g

  # DR-022 app-VM preprocess sidecar (DICOM-only cluster path).
  #
  # Cluster ApptainerAdapter is DICOM-only; the PHI-bearing .e2e must NEVER
  # leave the app VM. This sidecar runs the same retinal-inference image but
  # exposes ONLY POST /preprocess: it reads the .e2e from the same volume the
  # libreclinica container writes to, runs `prepare_bscan_dcm` (PHI-redacted),
  # and streams back the bscan.dcm bytes. No /run (the cluster owns inference),
  # no worker (no DB poll), no model runners.
  #
  # The libreclinica controller's RemoteRetinalInferenceClient hits this at
  # http://retinal-preprocess:8000 (compose-network DNS) when the Java
  # config key core.retinalInference.preprocessUrl is set.
  retinal-preprocess:
    image: libreclinica-muw-retinal-inference:latest
    container_name: libreclinica-muw-retinal-preprocess-1
    # Same image, but only the preprocess endpoint is enabled.
    environment:
      # Placeholder adapter is fine — /preprocess never calls adapter.full_volume,
      # it just exercises e2e_parser.prepare_bscan_dcm.
      RETINAL_INFERENCE_INFERENCE_ADAPTER: placeholder
      RETINAL_INFERENCE_WORKER_ENABLED: "false"
      RETINAL_INFERENCE_RUN_ENDPOINT_ENABLED: "false"
      RETINAL_INFERENCE_PREPROCESS_ENDPOINT_ENABLED: "true"
      # Must match core.retinalInference.preprocessToken in datainfo.properties.
      # Override at deploy time via the env var if /etc/libreclinica/env is in
      # use; the inlined value here is the dev default committed alongside the
      # matching datainfo value (single-sysadmin posture per DR-022 runbook).
      RETINAL_INFERENCE_AUTH_TOKEN: ${RETINAL_INFERENCE_PREPROCESS_TOKEN:-cb2e7d0edd4d54cd8af46bbef78755a7}
      RETINAL_INFERENCE_SHARED_TMPDIR: /var/lib/retinal-inference/tmp
      # DR-022 Wave 1A: sidecar persists three companion files per source
      # .e2e here — bscan.dcm + fundus.png + geometry.json. The libreclinica
      # container reads them through the same bind via
      # core.retinalInference.bscanStorePath.
      RETINAL_INFERENCE_BSCAN_STORE: /var/lib/libreclinica/retinal-artifacts/bscans
    volumes:
      # Same RO bind as the main service so the preprocess sidecar can read
      # the .e2e the libreclinica controller persisted.
      - ./docker/e2e-uploads:/var/lib/libreclinica/e2e-uploads:ro
      - ./docker/retinal-tmp:/var/lib/retinal-inference/tmp
      # Writable bind for the per-source-scan companion files.
      - ./docker/retinal-artifacts:/var/lib/libreclinica/retinal-artifacts
    cpus: "2.0"
    # 2026-06-18 — bumped from 2g to 10g after the preprocess sidecar
    # OOM-killed (SIGKILL, exit 137) THREE separate times during the
    # 2026-06-18 smoke (initial run, after the first bump to 6 g, and
    # after the bind→remote dispatch landed). The sidecar holds the
    # full bscan volume + intermediate DICOM buffer in RAM during the
    # /preprocess call; multi-volume 200 MB .e2e files apparently need
    # more headroom than 6 GiB, and the Python heap doesn't shrink
    # between requests. 10 GiB is the new ceiling — if this trips
    # again the next fix is to add `restart: on-failure` so the
    # sidecar self-recovers without manual intervention, plus a Python
    # follow-up to stream-decode instead of buffering the whole volume.
    mem_limit: 10g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # Fluid model-runner (RetInsight fluidseg, IRF/SRF/PED). Behind the `optima`
  # compose profile because its image needs vendor wheels (runners/fluid/wheels/)
  # + mounted weights that aren't in git — so the default `docker compose up`
  # does not try to build it. Start with: docker compose --profile optima up.
  retinal-runner-fluid:
    build: ./retinal-inference/runners/fluid
    image: libreclinica-muw-retinal-runner-fluid:latest
    container_name: libreclinica-muw-retinal-runner-fluid-1
    profiles: ["optima"]
    # No Postgres dep — runners only expose /infer over HTTP.
    environment:
      RUNNER_FLUID_CPU: "1"
    volumes:
      # MUST mount at the same absolute path the sidecar uses — it passes
      # absolute bscan_dcm_path / output_dir in the /infer request. (fluidseg
      # 1.3.0 weights are baked into the image, so no weights mount here.)
      - ./docker/retinal-inference-storage:/var/lib/libreclinica/segmentation-output
      # DR-022: shared tempdir bind so the sidecar's /run TemporaryDirectory is
      # visible to every runner at the same absolute path. Stays empty between
      # requests (sidecar nukes its tempdir on response).
      - ./docker/retinal-tmp:/var/lib/retinal-inference/tmp
    cpus: "4.0"
    mem_limit: 6g

  # ONL model-runner (sese_onl, outer nuclear layer thickness). Same `optima`
  # profile gate — its image needs the vendor code (runners/onl/code/) + mounted
  # weights, neither in git.
  retinal-runner-onl:
    build: ./retinal-inference/runners/onl
    image: libreclinica-muw-retinal-runner-onl:latest
    container_name: libreclinica-muw-retinal-runner-onl-1
    profiles: ["optima"]
    # No Postgres dep — runners only expose /infer over HTTP.
    volumes:
      - ./docker/retinal-inference-storage:/var/lib/libreclinica/segmentation-output
      # DR-022: shared tempdir bind so the sidecar's /run TemporaryDirectory is
      # visible to every runner at the same absolute path. Stays empty between
      # requests (sidecar nukes its tempdir on response).
      - ./docker/retinal-tmp:/var/lib/retinal-inference/tmp
      - ${RETINAL_ONL_WEIGHTS_DIR:-./docker/retinal-weights/onl}:/weights:ro
    cpus: "4.0"
    mem_limit: 6g

  # PR model-runner (sese_pr, photoreceptor layer — BMEIS / OB-OPR boundaries).
  # Same `optima` profile; needs the vendor code (runners/pr/code/) + weights.
  # PyTorch-1.0 pickle — see runners/pr/README.md for the torch/weight caveat.
  retinal-runner-pr:
    build: ./retinal-inference/runners/pr
    image: libreclinica-muw-retinal-runner-pr:latest
    container_name: libreclinica-muw-retinal-runner-pr-1
    profiles: ["optima"]
    # No Postgres dep — runners only expose /infer over HTTP.
    volumes:
      - ./docker/retinal-inference-storage:/var/lib/libreclinica/segmentation-output
      # DR-022: shared tempdir bind so the sidecar's /run TemporaryDirectory is
      # visible to every runner at the same absolute path. Stays empty between
      # requests (sidecar nukes its tempdir on response).
      - ./docker/retinal-tmp:/var/lib/retinal-inference/tmp
      - ${RETINAL_PR_WEIGHTS_DIR:-./docker/retinal-weights/pr}:/weights:ro
    cpus: "4.0"
    mem_limit: 6g

  # GA model-runner (sese_ga RPEL -> GA area). GATED: separate `ga` profile + a
  # GPU host. Needs the proprietary IOWA OCTLayerSeg binary, the ~10 GB .sif, the
  # vendor code (runners/ga/code/), and the checkpoints — none in git. Running
  # the .sif in-container needs a privileged/GPU setup; often easier to run this
  # runner directly on a GPU host. See runners/ga/README.md.
  retinal-runner-ga:
    build: ./retinal-inference/runners/ga
    image: libreclinica-muw-retinal-runner-ga:latest
    container_name: libreclinica-muw-retinal-runner-ga-1
    profiles: ["ga"]
    # gpus: all          # uncomment on an NVIDIA host (compose GPU passthrough)
    # No Postgres dep — runners only expose /infer over HTTP.
    volumes:
      - ./docker/retinal-inference-storage:/var/lib/libreclinica/segmentation-output
      # DR-022: shared tempdir bind so the sidecar's /run TemporaryDirectory is
      # visible to every runner at the same absolute path. Stays empty between
      # requests (sidecar nukes its tempdir on response).
      - ./docker/retinal-tmp:/var/lib/retinal-inference/tmp
      - ${RETINAL_GA_WEIGHTS_DIR:-./docker/retinal-weights/ga}:/weights:ro
      - ${RETINAL_GA_IOWA_BINARY:-./docker/iowa/OCTLayerSeg3.6}:/opt/iowa/OCTLayerSeg3.6:ro
      - ${RETINAL_GA_SIF:-./docker/sese_ga/pytorch_optima_dl.v4.sif}:/opt/sese_ga/pytorch_optima_dl.v4.sif:ro
    mem_limit: 12g

volumes:
  libreclinica-db-data:
