#############################################################################
# 1 - Database Configuration
#
# Database configuration is done with the following 6 properties
# The dbType option has to be postgres.
# Enter the user name and password to access the database in
# dbUser and dbPass.
# The db field is for the name of the database and provide the port
# in dbPort.
# dbHost can be a URL, IP address or localhost
#
# REQUIRED
#############################################################################
dbType=postgres
dbUser=clinica
dbPass=clinica
db=libreclinica
dbPort=5432
dbHost=db

# Phase C.3 (decision 2026-05-28): optional JDBC URL hardening for
# CVE-2025-49146 + CVE-2026-42198. Leave both blank for local-dev
# compose (the bundled postgres:14-alpine has no SSL cert).
# For prod: set jdbc.sslMode=verify-full and jdbc.scramMaxIterations=10000
# AFTER verifying the postgres server accepts the cert + the SCRAM
# iteration count. The values are appended to the JDBC URL automatically
# by at.ac.meduniwien.ophthalmology.libreclinica.dao.core.CoreResources.
#jdbc.sslMode=verify-full
#jdbc.scramMaxIterations=10000

#############################################################################
# 2 - filePath
#
# File Path is the string which declares the
# repository for all uploaded and generated
# files in the system, including CRFs and
# data sets.  The directory should NOT be
# accessible by the web server.
#
# REQUIRED.
#############################################################################
filePath=${catalina.home}/${WEBAPP.lower}.data/

#############################################################################
# 3 - Attached File Location
# Location for files if item data type is "file". If it has been kept empty,
# "filePath" will be used as the attached file location.
# This will be a sub folder within the filePath location only.
# You may configure a full path that points to a directory outside of the filePath.
# If you configure a full path, it must have a trailing slash.
# Example = /usr/local/attached_file/ or C:\\attached_file\\
#
# NOT REQUIRED
#############################################################################
# attached_file_location=

#############################################################################
# 4 - user_account_notification
#
# User Account Notification is the method by
# which new users are sent their passwords.
# Users can be sent passwords via email,
# or the password can be displayed on the screen
# to the administrator, who is instructed to
# write it down and physically give it to the user
# in question.  The default is email.
#
# REQUIRED.
#############################################################################
userAccountNotification=email

#############################################################################
# 5 - adminEmail
#
# The Admin Email is the field to set the administrator's
# email for a given server. It is also used for
# replies to the email messages sent by the system.
#
# REQUIRED
#############################################################################
adminEmail=admin@example.com

#############################################################################
# 6- Spring Based Email System
#
# Configure the Email SMTP host below. If the host
# requires a username and password make sure
# mail.smtp(s).auth is set to true.
# Configure mail protocol via mail.protocol, Valid options
# would be smtp or smtps.
# Configure smtp over ttls by setting mail.smtp(s).starttls.enable
# to true.
# Configure connection timeout. Preconfigred to 5 secs
#############################################################################
mailHost=smtp
mailPort=1025
mailProtocol=smtp
mailUsername=
mailPassword=
mailSmtpAuth=false
mailSmtpStarttls.enable=false
mailSmtpsAuth=false
mailSmtpsStarttls.enable=false
mailSmtpConnectionTimeout=5000
mailErrorMsg=developers@openclinica.org

#############################################################################
# 8 - sysURL
#
# The web address for the system.  It can either be an external
# address (demo.openclinica.org) or an internal IP
# address (192.168.2.000).
# NOTE: If you reconfigure the address or port in some later
# step, such as by configuring SSL, you will need to come back
# and update this file. You will also need to restart tomcat
# for changes to this take effect.
#
# REQUIRED
#############################################################################
sysURL=http://localhost:8080/${WEBAPP}/MainMenu

#############################################################################
# 9 - max_inactive_interval
#
# This is maximum time interval between client requests. That is,
# if users leave any page open without sending a request to the
# server, after this time interval, when users attempt sending
# request they will be directed to login page.
#
# REQUIRED
#############################################################################
maxInactiveInterval=3600

#############################################################################
# 11 - Logging configuration

# SysLog support has been fully implemented in LibreClinica, but by default has been turned off.
# Every piece of code that could send information to the syslog server has not been reviewed
# and cleaned to ensure it is entirely readable and useful.  This will be an ongoing effort
# and resolved in a future release.  Please use the SysLog support at your own risk.
#
# Specify the log location - local/syslog/both
#
log.dir=${catalina.home}/logs/libreclinica
logLocation=local
#
# Specify logging level - trace/debug/info/warn/error
logLevel=debug
syslog.host=localhost
syslog.port=514

#############################################################################
# 12- News/About
# On the LibreClinica login screen, there will be a box to the right of the login section
# which can contain an RSS feed.  You can configure what RSS feed is used in the rss.rl field.
# If you do not want the RSS feed, please comment out rss.url and rss.more and uncomment
# about.text1 and about.text2.  These two fields can be used for any free form text that you
# you want to appear on the LibreClinica login page.
# the default feed is http://clinicalresearch.wordpress.com/feed/
# default value for rss.more http://clinicalresearch.wordpress.com/
#############################################################################
# rssUrl=http://clinicalresearch.wordpress.com/feed/
# rssMore=http://clinicalresearch.wordpress.com/
# about.text1= Hello World 1
# about.text2= Hello World 2

#############################################################################
# 13 - CRF File Upload Configuration
# crf.file.extensionSettings can have 3 values valid,invalid or left empty which defaults to valid.
# if crf.file.extensionSetting= valid , then extensions specified can be uploaded.
# if crf.file.extensionSetting= invalid , then extensions specified can NOT be uploaded.
# if crf.file.extensions is left empty and crf.file.extensionSettings=valid then all extensions are valid
# if crf.file.extensions is left empty and crf.file.extensionSettings=invalid then all extensions are NOT valid
# separate extensions with a comma and do not include the leading dot.
#############################################################################
# crfFileExtensions=
# crfFileExtensionSettings=

# Phase E.6 (2026-06-06): SPA CRF file-upload caps. Server-side
# enforcement happens in CrfFileStorageService; the SPA also
# pre-validates against these so the user gets immediate feedback.
# Defaults applied when left empty:
#   crf.file.maxBytes      52428800 (50 MiB)
#   crf.file.extensions    pdf,jpg,jpeg,png,tif,tiff
# crf.file.maxBytes=52428800
# crf.file.extensions=pdf,jpg,jpeg,png,tif,tiff

#############################################################################
# 14 - supportURL
#
# The Support URL is included in the support button that appears
# in the top right corner of all pages in OPenClinica. By including
# the URL here we will be able to configure it depending on the adopter
#
# REQUIRED
#############################################################################
# supportURL=https://www.openclinica.com/support

#############################################################################
# 15- Quartz Scheduler Configuration
#
# Configure the mis-fire threshold for the scheduler,
# and the number of extract jobs can run at a single time.
#
# REQUIRED
#############################################################################
org.quartz.jobStore.misfireThreshold=18000000
# Quartz JDBC JobStore configuration. The applicationContext-core-scheduler.xml
# references these via s[...] placeholders; they were missing in this file
# (and in upstream's docker/config/datainfo.properties) which broke the compose
# smoke test on 2026-05-28. The institutional schema uses `oc_qrtz_` table
# prefix - verified via psql \dt on the compose db (created by Liquibase
# migration/lc-1.0.0/qrtz_blob_to_bytea.xml).
#
# Deliberately NOT setting org.quartz.jobStore.class here: when the Spring
# bean has dataSource set (in applicationContext-core-scheduler.xml), Spring's
# SchedulerFactoryBean.createScheduler() needs to install its own
# LocalDataSourceJobStore connected to its DBConnectionManager registration.
# Setting jobStore.class via Quartz props bypasses that wiring.
org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
org.quartz.jobStore.useProperties=false
org.quartz.jobStore.tablePrefix=oc_qrtz_
org.quartz.threadPool.threadCount=1
org.quartz.threadPool.threadPriority=5

#############################################################################
# 16 - CCTS configuration
#
# This is used for LibreClinica instances that have been modified and configured
# to work with the Cancer Clinical Trials Suites.  This is a caBIG suite of applications.
# The configuration determines how long LibreClinica will hold a transaction from C3PR
# and will wait for a roll back message before committing it to the database.
#
# NOT REQUIRED
#############################################################################
ccts.waitBeforeCommit=6000

#############################################################################
# 17 - Facility information
#
# The LibreClinica defaults will be used when creating a new study
# unless you uncomment each property and provide a value next to
# each = sign.
#
# NOT REQUIRED
#############################################################################
# FacName=
# FacCity=
# FacState=
# FacZIP=
# FacCountry=
# FacContactName=
# FacContactDegree=
# FacContactPhone=
# FacContactEmail=

#############################################################################
# 18 - export data file path
#
# Export Data File Path is the string which (optionally)
# declares a specific file path for file extracts to be
# saved.  This is a sub folder of filePath.
# Note that if it is set, files from Jobs only will be saved
# to two places: this directory and under the above file path
# declared in the 'filePath' property.
#
# NOT REQUIRED.  Please comment out if you want Jobs to generate
# one file/files only, in the directory structure under 'filePath'.
#############################################################################
# exportFilePath=scheduled_data_export

##############################################################
# extract.number defines how many subjects the system will paginate through when creating the ODM file to
# to be transformed by the XSLT engine.  This number can be increased to use higher amounts of memory and
# potentially decrease the amount of wait time.  Lower this number if you have an extremely large amount of
# event definitions to reduce the impact on concurrent users in the system at the time of the extract.
# This is a global setting that applies to all extracts in your LibreClinica instance.
#####################################################################################
extract.number=99

##############################################################
# Phase E.6 — archived-dataset-file retention window (days).
# Dataset exports (CSV / ODM-XML / SPSS dumps) are persisted under
# archived_dataset_file with their on-disk artefact at file_reference.
# A daily Quartz sweep (ArchivedFileRetentionService, fires at 03:00)
# removes rows + their files once they exceed this age, bounding disk
# growth and limiting the egress window. Set to 0 or negative to fall
# back to the 90-day default.
#####################################################################################
libreclinica.export.retention.days=90

#############################################################################
# 19 - Usage statistics configuration
# Usage statistics refers to information automatically sent back to LibreClinica.org
# to help us figure out how well LibreClinica is working and help us improve it in
# future versions.
# This includes technical information such as the version of LibreClinica installed, the number of studies created and user load. These statistics DO NOT include information such as study or CRF names, study data, or user information. We collect this data in aggregate and use it according to our Privacy Policy [https://community.openclinica.com/privacy-policy] to improve our products and services.
#
# As part of system configuration, we give you the option to help us improve LibreClinica by sending these usage statistics. If you elect to send this information but later change your mind, you can disable this feature in the datainfo.properties file by changing
# 'collectStats' value to 'false'
collectStats=true
usage.stats.host=usage.openclinica.com
usage.stats.port=514
LibreClinica.version=${pom.version}
#############################################################################
# 20 - Rule Designer configuration
# LibreClinica Enterprise customers are allowed access to a GUI based Rule Designer.
# This configuration allows the LibreClinica instance to contact the Rule Designer for
# access.  If you are not an LibreClinica Enterprise customer, your users will be re-directed
# to a landing page and will have to navigate back to their LibreClinica instance.
# If you do not want to see a link to the Rule Designer on the Build Study page,
# you must delete this configuration option.
#
# To become an LibreClinica Enterprise customer, please contact sales@openclinica.com
#############################################################################
designerURL=https://designer13.openclinica.com/
#############################################################################
# 21 - LDAP/Active Directory configuration
#
# IMPORTANT: To use LDAP, the property of the configuration number '10 - change_passwd_required' must be set to '0'
#
#############################################################################

# If ldap is enabled (values:'true' or 'false')
ldap.enabled=false

# LDAP host in the form 'ldap://<host>:<port">'
ldap.host=ldap://anaconda.isovera.local:389

# User distinguished name used to authenticate to LDAP
#ldap.userDn=cn=ldap1,ou=ldap,dc=isovera,dc=local
ldap.userDn=cn=chin,ou=chin_ldap,dc=isovera,dc=local

# Password used to authenticate to LDAP
ldap.password=ABCDEFabcsdasdasddef123456!@#$%^

# Query used to during login to find the LDAP user by username. Should always return a maximum of one result.
ldap.loginQuery=(sAMAccountName={0})

# URL to redirect LDAP users to retrieve a forgotten password
ldap.passwordRecoveryURL=http://www.google.com?&q=what+do+i+do+if+i+forgot+my+password%3F

# BaseDN to search for users
ldap.userSearch.baseDn=DC=isovera,dc=local

# Query used to search users in the user search screen (when creating a new user).
# The '{0}' placehoder is replaced by the value typed in the 'filter' field.

# Simple query, searches only username
#ldap.userSearch.query=(&(memberOf=CN=ldapgroup,OU=ldap,DC=isovera,DC=local)(sAMAccountName=*{0}*))
#

# Sophisticated query, searches username, first name, last name and email
ldap.userSearch.query=(&(memberOf=CN=ldapgroup,OU=ldap,DC=isovera,dc=local)(|(sAMAccountName=*{0}*)))

# Field used to retrieve the user's distinguished name
ldap.userData.distinguishedName=distinguishedName

# Field used to retrieve the user's username
ldap.userData.username=sAMAccountName

# Field used to retrieve the user's first name
ldap.userData.firstName=givenName

# Field used to retrieve the user's last name
ldap.userData.lastName=sn

# Field used to retrieve the user's email
ldap.userData.email=mail

# Field used to retrieve the user's organization
ldap.userData.organization=company

#############################################################################
# 22 - 2-Factor Authentification (2-FA)
#
# System wide settings for activating the 2-factor authentication. Activating
# means that an additional field is displaying during login. Also the user is
# able to configure this authentication method within his/her profile.
#
# REQUIRED
#############################################################################
2fa.activated=false

#############################################################################
# 23 - 2-Factor Authentification (2-FA)
#
# System wide settings for the type how to handle to 2-FA. Currently the
# following two options are possible.
#
# APPLICATION: QR-Code can be scanned via the client application itself.
# LETTER: QR-Code has to be provided via PDF printout to the user.
#
# REQUIRED
#############################################################################
2fa.type=APPLICATION
# 2fa.type=LETTER

##############################################################################
# 24 - 2-FA due date
#
# System wide settings for the date at which a 2-FA has to be enabled for users
# mandatorily. Use ISO format: yyyy-MM-dd
#
# OPTIONAL - Only needed when 2fa.activated=true and 2fa.type=LETTER
#############################################################################
2fa.dueDate=2030-01-01

# When set to true, PDF manuals can be downloaded via the application
# and displays a "Manual Download" section within "Tasks" menu. Valid
# values: [true|false(default)].
display.manual=false

#############################################################################
# 25 - Retinal inference sidecar (Phase E.7)
#
# Base URL of the FastAPI sidecar exposing POST /screen for the fast
# screen path. The default points at the compose hostname; override via
# env when running the sidecar elsewhere.
#
# REQUIRED (when the OCT upload endpoint is in use)
#############################################################################
core.retinalInference.baseUrl=http://retinal-inference:8000

#############################################################################
# 26 - Retinal inference E2E uploads dir
#
# Filesystem directory where the Java side writes uploaded Heidelberg .e2e
# binaries before enqueueing a retinal_inference_job. The sidecar mounts
# this same path read-only and reads the file when /screen runs.
#
# REQUIRED (when the OCT upload endpoint is in use)
#############################################################################
core.retinalInference.e2eUploadsPath=/var/lib/libreclinica/e2e-uploads

#############################################################################
# 27 - Remote GPU sidecar URL (DR-022)
#
# When set, the OCT upload endpoint pushes the (preprocessed) bscan.dcm to
# the remote cluster's stateless POST /run. Blank disables the remote
# branch entirely — single-host dev compose keeps using the existing local
# sidecar + DB-poll worker.
#
# The client appends "/run" itself, so set the BASE URL only, e.g.
# http://cn5.cir.meduniwien.ac.at:8000  (NOT .../run).
#
# OPTIONAL — leave blank for single-host dev / fallback.
#############################################################################
# Dev: SSH-tunneled through the app VM (Mac is not on the cluster firewall
# allowlist). Production should set this to http://cn5.cir.meduniwien.ac.at:8000
# from the app VM directly.
core.retinalInference.remotePushUrl=http://host.docker.internal:8000

#############################################################################
# 28 - Remote /run shared-secret token (DR-022)
#
# Value of the X-MUW-Inference-Token header the cluster verifies against
# its own RETINAL_INFERENCE_AUTH_TOKEN env. Plaintext on disk is fine for
# the MUW single-sysadmin posture; production deployments should source
# this from /etc/libreclinica/env at Tomcat startup rather than baking
# the value into datainfo.properties.
#
# OPTIONAL — required only when remotePushUrl is set.
#############################################################################
core.retinalInference.remotePushToken=choose-a-long-shared-secret

#############################################################################
# 28a - App-VM preprocess sidecar URL (DR-022)
#
# When set, the .e2e is first POSTed to ${preprocessUrl}/preprocess to
# convert it to a PHI-redacted bscan.dcm; only the DICOM is forwarded to
# the cluster (which is DICOM-only). The PHI-bearing .e2e never leaves the
# app VM. Leave blank for single-host dev — the cluster's OptimaAdapter
# ingests the .e2e directly there.
#
# Compose dev: http://retinal-preprocess:8000 (the new preprocess service).
# Production: a local uvicorn process bound on 127.0.0.1.
#
# OPTIONAL — required only when shipping to a DICOM-only cluster.
#############################################################################
core.retinalInference.preprocessUrl=http://retinal-preprocess:8000

#############################################################################
# 28b - Preprocess sidecar shared-secret token (DR-022)
#
# Header X-MUW-Inference-Token the preprocess sidecar verifies. Falls back
# to remotePushToken when blank (single-secret convenience). Set the
# preprocess sidecar's RETINAL_INFERENCE_AUTH_TOKEN to match.
#
# OPTIONAL — required only when preprocessUrl is set AND the preprocess
# sidecar uses a different secret than the cluster.
#############################################################################
core.retinalInference.preprocessToken=cb2e7d0edd4d54cd8af46bbef78755a7

#############################################################################
# 29 - Remote /run read+connect timeout in seconds (DR-022)
#
# Generous default — production GPU finishes a scan in 5-30 s but Mac
# dev (amd64 emulation) can take 25+ minutes. Lower it on real GPUs to
# fail fast if the sidecar hangs.
#
# OPTIONAL — defaults to 3600 (60 min).
#############################################################################
core.retinalInference.remotePushTimeoutSecs=3600

#############################################################################
# 30 - Retinal artifact store path (DR-022)
#
# Filesystem directory where the controller writes the artifacts returned
# inline by the remote /run envelope. One subdirectory per job (UUID),
# each containing the runner's CSV/NPY/PNG outputs. The result row's
# bscan_masks_dir column points at the job dir.
#
# OPTIONAL — defaults to /var/lib/libreclinica/retinal-artifacts.
#############################################################################
core.retinalInference.artifactStorePath=/var/lib/libreclinica/retinal-artifacts

#############################################################################
# 30a - Cluster health panel: per-node probe list (2026-09-22)
#
# Comma-separated name=baseUrl pairs the sysadmin System Status page probes
# individually, e.g.
#   on3=http://149.148.108.144:8000,cn6=http://149.148.108.170:8000
#
# Needed because behind the nginx failover (deploy/nginx/ecrf.conf) the
# remotePushUrl answers /health as long as EITHER node is up — an admin would
# see "healthy" while the primary is dead and the backup carries the load.
# List the real nodes here. Blank = probe remotePushUrl alone.
#
# OPTIONAL.
#############################################################################
core.retinalInference.clusterNodes=

#############################################################################
# 30b - Cluster monitor log (2026-09-22)
#
# Where deploy/check-retinal-cluster.sh (root cron on the app VM) appends
# its alerts. Kept under /var/lib/libreclinica so the app container can read
# it and the System Status page can show the last alerts without an MTA.
#
# OPTIONAL — blank hides the alerts panel.
#############################################################################
core.retinalInference.clusterMonitorLog=/var/lib/libreclinica/retinal-cluster-monitor.log

#############################################################################
# 31 - Terminology: scheduled medication-catalogue ingest (#26 Slice 2)
#
# Nightly (03:30 Europe/Vienna) the app can refresh the "medication" code
# system from the ELGA termgit ASP-Liste (Austrian medicinal products) FHIR
# CodeSystem on GitLab. Change-detection uses GitLab's file-metadata
# content_sha256, so a quiet night is one cheap request, not a 95 MB
# download. Feeds the CRF builder's medication autocomplete + dosage/unit
# fill-map (see TerminologyIngestScheduler / TerminologyIngestService).
#
# DISABLED by default — dev/CI must not reach the internet or load 21k rows
# on boot. Set enabled=true in an institutional deployment to activate.
#
# When enabled AND no catalogue has ever been loaded, the app performs a
# one-time first-boot load on startup (on a background thread, so it never
# blocks the app coming up) so medication autocomplete works immediately
# rather than only after the first nightly run. Once loaded, restarts no-op
# and the nightly job keeps it fresh.
#
# ICD-10-GM (diagnoses) is loaded via the manual POST /api/v1/terminology/
# ingest path and is unaffected by these keys.
#############################################################################
core.terminology.medication.enabled=false
# GitLab project (URL-encoded namespace/path) + file + ref. Defaults target
# the ELGA termgit ASP-Liste; override to pin a specific commit as the ref.
core.terminology.medication.gitlabProject=elga-gmbh%2Ftermgit
core.terminology.medication.filePath=terminologies%2FCodeSystem-asp-liste%2FCodeSystem-asp-liste.4.fhir.json
core.terminology.medication.ref=main

#############################################################################
# DICOM C-STORE receiver for handheld fundus cameras (DR-025)
#
# Dev/compose defaults — the dicom-scp sidecar is not wired into the dev
# compose yet, so this stays disabled. Slice 1 adds the sidecar service.
#############################################################################
core.dicom.scp.enabled=false
core.dicom.scp.aeTitle=LIBRECLINICA
core.dicom.scp.port=11112
core.dicom.scp.allowedCallingAeTitles=
# Studies the Modality Worklist may offer a camera / the upload pages may
# resolve labels against, as comma-separated study OIDs. Blank = every study.
# Set these in production: a worklist hands a shared handheld the subject
# labels, sex and dates of birth of every visit in the window.
core.dicom.worklist.studyOids=
core.ingest.portal.studyOids=
# Whether the unauthenticated upload page may show a list of the day's
# scheduled visits so the operator can pick one instead of typing a label. Off
# by default: a list of today's patients on a page that needs no login is a
# disclosure in its own right, even though it shows only pseudonymised labels.
# Requires data-protection sign-off before being switched on; when on, it
# honours core.ingest.portal.studyOids.
core.ingest.portal.todaysVisits=false
core.dicom.ingest.storePath=/var/lib/libreclinica/dicom-ingest
# How long a DISMISSED fundus image is kept before the nightly sweep deletes
# the file and its row. A dismissal is the operator's decision that the image
# is not study data; keeping the photograph forever afterwards is the kind of
# indefinite retention a data-protection review asks about. Bound images are
# study data and are never swept.
core.ingest.retention.dismissedDays=30
core.dicom.ingest.token=
# 2026-09-23 — the Optomed Client's worklist file, for a Lumo that reaches the
# platform only over USB through the vendor's PC client (it cannot join the
# WPA2-Enterprise WLAN and no other WLAN is permitted). The Optomed Bridge tray
# app on the clinic PC pulls GET /api/v1/device/optomed/worklist.txt every few
# minutes and drops it into the Client's watched folder; the Client pushes it
# to the camera on the next dock. Off by default and answering 404 while off:
# it is a list of the day's patients, like core.ingest.portal.todaysVisits,
# and needs the same data-protection sign-off. Honours
# core.dicom.worklist.studyOids so a shared handheld sees one study's schedule.
# The date of birth in the file is a placeholder, never the real one.
core.optomed.worklist.enabled=false
# Its own shared secret (header X-MUW-Optomed-Token) — deliberately NOT
# core.dicom.ingest.token, so a secret typed into a camera's config screen
# does not also open this, nor this that. Blank = the endpoint answers 503.
core.optomed.worklist.token=
# DR-031 — the Remidio cloud pull. The Remidio FOP has no DICOM and nothing
# can be pushed to it; its app uploads every capture to Remidio's cloud, and
# this job lists that cloud for our site every intervalSeconds and files each
# new image into the reconciliation inbox (source_kind 'remidio'), bound to
# the visit when the MRN the photographer typed is a subject label with one
# visit on the exam date, UNBOUND otherwise. Name, date of birth and sex are
# read from the API and discarded. Off by default; nothing runs until enabled.
core.remidio.pull.enabled=false
# The backend that serves OUR organisation — per-user via
# remidio-proxy-production.appspot.com/api/domain/domainForUser, verified as
# the Germany host on 2026-09-23. Not the India host the public docs show.
core.remidio.baseUrl=https://remidio-backend-germany.appspot.com
# The client pair Remidio issues to integrators. clientName is the actor the
# token was minted for (PACS_GATEWAY) — any other name is an unhandled 500.
core.remidio.clientName=PACS_GATEWAY
core.remidio.clientIdentificationToken=
# A dedicated Remidio account for this integration. getAuthToken invalidates
# the previous clientAuthToken, so a second consumer on the same account would
# knock this one out (and vice versa).
core.remidio.email=
core.remidio.password=
# The site's custom identifier as set in the Remidio dashboard (site settings).
# getExamsByDate wants this, never the numeric site id.
core.remidio.siteCustomId=
# How often a pass runs. Each pass lists from (last successful pass minus
# overlapDays) to today; the first pass lists from `since` (ISO date, default
# one year back) in 30-day chunks. The overlap is NOT the poll interval: the
# listing filters by capture date, not upload time, so it is how late a phone
# may sync and still be caught. Exams already filed are skipped by id, so
# overlap never files twice; downtime catches up on its own.
core.remidio.pull.intervalSeconds=120
core.remidio.pull.overlapDays=14
core.remidio.pull.since=
# The Remidio side of the worklist. The FOP app has no patient list, only an
# exam list: a subject the photographer should shoot must exist in Remidio's
# cloud as a patient WITH an exam. On every pass the sync takes the visits
# scheduled from behindDays ago to aheadDays ahead (same scope as the DICOM
# worklist, core.dicom.worklist.studyOids) and creates, for each one that is
# missing, a patient (MRN = subject label, placeholder name/DOB, sex mapped
# to MALE/FEMALE) and an exam named "<label> <visit>". A capture made into
# that exam binds straight to its visit. This uses the web dashboard's own
# API — the same account as the pull, but the dashboard's client pair (the
# public one every browser session sends) and the site's NUMERIC id.
# Remidio cannot delete a patient, so the sync creates only for live visits
# and looks up the MRN before every create. Off by default.
core.remidio.patientSync.enabled=false
core.remidio.dashboard.clientName=WEB_DASHBOARD
core.remidio.dashboard.clientIdentificationToken=
core.remidio.siteId=
core.remidio.patientSync.createExams=true
core.remidio.patientSync.aheadDays=7
core.remidio.patientSync.behindDays=1
# DR-029 — the combined upload page (/app/upload). Uploaded JPEG/PNG and DICOM
# files land under this root, one subdirectory per kind; the two older roots
# above stay readable so nothing already recorded moves. Must be the same bind
# in the app and the dicom-scp containers (compose.yaml mounts ./docker/ingest
# into both).
core.ingest.storePath=/var/lib/libreclinica/ingest
# Where the app asks the dicom-scp sidecar to describe an uploaded DICOM file
# (tags + preview) and to pseudonymise it in place before the row is written.
# A clinic camera's export carries the hospital's patient; the platform never
# keeps that. Without a reachable sidecar DICOM uploads are refused with 503
# rather than stored as-is — so this needs the `dicom` compose profile and a
# core.dicom.ingest.token shared with DICOM_SCP_INGEST_TOKEN. Blank = no DICOM
# uploads.
core.dicom.describe.url=http://dicom-scp:8081/describe
