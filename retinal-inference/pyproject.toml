[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-inference"
version = "0.1.0"
description = "LibreClinicaMUW task-agnostic retinal inference sidecar (FastAPI + Postgres-queue worker)."
requires-python = ">=3.11"
authors = [
    { name = "MUW Ophthalmology" },
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "psycopg2-binary==2.9.10",
    "pydicom==3.0.2",
    # numpy>=2.1 dropped glibc-2.17 (manylinux2014) wheels, which the CentOS 7
    # GPU cluster needs. A floor keeps modern deploys current; pin numpy<2.1 at
    # install time on the cluster (see docs/cluster-deployment.md §2).
    "numpy>=1.26",
    # FastAPI multipart parsing for POST /run (DR-022). UploadFile+Form rely on
    # python-multipart at request time even though it's not a direct fastapi
    # dependency.
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
# DR-024 — the .e2e -> bscan.dcm ingestion seam moved out into the
# `muw-e2e-converter` package (sibling directory in this repo). The
# LOCAL `retinal-preprocess` docker service installs it via the
# Dockerfile (which pip-installs ../muw-e2e-converter explicitly); the
# cluster's bare-metal cn5 deployment deliberately does NOT install it
# (the cluster's ApptainerAdapter rejects .e2e). The cluster's
# /preprocess endpoint, if mistakenly enabled, returns HTTP 503 with
# a clear pointer to DR-024.
#
# This `[converter]` extra is documentation: it lists the sibling
# package as a dependency for editor / IDE / local-pip workflows. The
# Docker build install path uses pip install -e ../muw-e2e-converter
# directly rather than this extra (path-style URLs in PEP 508 extras
# have spotty resolver support across pip versions).
converter = [
    "muw-e2e-converter",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
