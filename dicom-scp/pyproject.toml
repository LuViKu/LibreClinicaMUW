[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-scp"
version = "0.1.0"
description = "DICOM C-STORE Storage SCP for fundus images — HealthAEye study (DR-025)"
requires-python = ">=3.11"
dependencies = [
    "pynetdicom==3.0.4",
    "pydicom==3.0.2",
    "numpy==2.1.3",
    "pillow==11.0.0",
    "requests==2.32.3",
    "pydantic-settings==2.5.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]
