name: CodeQL

# Triggers tuned 2026-05-28 alongside the build.yml refactor (save
# Actions credits during autonomous Phase B work): one run per merge
# to lc-develop/master, the weekly cron heartbeat, and manual dispatch.
# PR runs disabled because CodeQL is a heavyweight scan; the schedule
# + per-merge runs catch regressions with much less spend.
on:
  push:
    branches: [lc-develop, master]
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One language's failure should not hide the other's findings.
      fail-fast: false
      matrix:
        # 2026-09-18 — python added. The three sidecars handle DICOM
        # associations, uploaded files and patient-identifying tags, and until
        # now got no static analysis at all: the scan covered the Java that
        # receives an image and not the Python that parses it off the wire.
        language: [java, python]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # Manual build steps - CodeQL's autobuild often fails on multi-module
      # legacy projects with custom plugin chains. Match exactly what the build
      # job in .github/workflows/build.yml does so the coverage matches.
      # Python needs no build step; CodeQL extracts the sources directly.
      - name: Maven compile (no tests)
        if: matrix.language == 'java'
        run: mvn -B -ntp -DskipTests=true clean compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
