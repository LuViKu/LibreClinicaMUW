version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - maven
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.security*"
          # org.springframework.ws* dropped — the ws/ module was retired
          # in Phase B.4 (PR #31). The pattern matched zero packages
          # post-removal; keeping it was misleading.
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
          - "tools.jackson*"
      hibernate:
        patterns:
          - "org.hibernate*"
      apache-commons:
        patterns:
          - "commons-*"
          - "org.apache.commons*"
      logback:
        patterns:
          - "ch.qos.logback*"
          - "org.slf4j*"
    ignore:
      # liquibase-core is pinned at 4.31.1 (see the comment at the pin in
      # pom.xml). 4.33.0 changes the checksum of every valueDate changeset and
      # fails startup on every existing database; 5.x is licensed
      # FSL-1.1-ALv2. A move past 4.32.x is a deliberate change, re-checked
      # by Liquibase363UpgradeDatabaseIT, not a weekly bump.
      - dependency-name: "org.liquibase:liquibase-core"
        versions: [">= 4.33.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
