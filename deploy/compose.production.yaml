# Production compose overlay for LibreClinicaMUW.
#
# Apply on top of the base compose.yaml:
#   docker compose -f compose.yaml -f deploy/compose.production.yaml \
#       up -d --no-build libreclinica db retinal-inference
#
# What this overlay changes vs the dev compose.yaml:
#   - libreclinica: pinned to ghcr.io/luviku/libreclinicamuw:<tag>, restart
#     policy added, host port bound to 127.0.0.1 (the institutional reverse
#     proxy is expected to localhost-target it via SSH tunnel or by sitting
#     on the same host).
#   - libreclinica: LIQUIBASE_CONTEXTS forced empty so the demo seed
#     changesets (M-001..M-007) are skipped on every boot.
#   - libreclinica: runtime config bind-mounted from
#     /opt/libreclinica/config so the operator can edit datainfo.properties
#     (mail relay, etc.) without rebuilding the image.
#   - db: postgres password sourced from the host env file, data volume
#     bind-mounted to /var/lib/libreclinica/postgres (matches the backup
#     timer's expectations).
#   - retinal-inference: storage volumes redirected to
#     /var/lib/libreclinica/*, restart policy added.
#   - dicom-scp: pinned to a published image, ingest store moved to
#     /var/lib/libreclinica/dicom-ingest, DICOM port bound to the
#     camera-facing address only. Behind the `dicom` profile, so it
#     starts only where COMPOSE_PROFILES includes it.
#   - smtp/mailcrab: not started in production (the systemd ExecStart in
#     libreclinica.service names the services explicitly and omits smtp).

name: libreclinica-muw

services:
  # 2026-07-06 — TLS reverse proxy + clean-URL router. Terminates HTTPS for
  # ecrf.augen.meduniwien.ac.at (+ the host FQDN), serves the SPA at the site
  # root, and forwards to the app over the compose network (libreclinica:8080).
  # Config: deploy/nginx/ecrf.conf. Cert + key live in /etc/libreclinica/tls/
  # (root-only, mounted read-only). systemd ExecStart must include `nginx`; the
  # app's host 8080 should be narrowed to 127.0.0.1 so users go through HTTPS.
  # See deploy/nginx/README.md.
  nginx:
    image: nginx:1.27-alpine
    container_name: libreclinica-muw-nginx-1
    restart: unless-stopped
    depends_on:
      - libreclinica
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/ecrf.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/libreclinica/tls:/etc/libreclinica/tls:ro

  libreclinica:
    image: ghcr.io/luviku/libreclinicamuw:${LIBRECLINICA_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # NOTE: the host bind for 8080 is owned entirely by the base compose.yaml
    # via ${LIBRECLINICA_BIND_ADDR}. We deliberately do NOT set `ports:` here —
    # Compose concatenates ports lists across files, so a second entry would
    # double-bind 8080 and fail to publish. Production sets
    # LIBRECLINICA_BIND_ADDR=0.0.0.0 in /etc/libreclinica/env (written by
    # setup-ubuntu-host.sh) so the separate-host reverse proxy can reach it;
    # narrow it to the VM's internal IP there if you want a tighter bind.
    # Access control is the campus perimeter's job (no local firewall by
    # design — see deploy/README.md § Prerequisites).
    environment:
      # Skip the demo Liquibase context (subjects + CRFs + dn_item_data
      # seed) — production starts on a clean schema.
      LIQUIBASE_CONTEXTS: ""
    volumes:
      # Host-mounted runtime config so the operator can edit
      # datainfo.properties (mailHost, mailUsername, mailPassword, SSO
      # values, etc.) without rebuilding the image. Source is seeded
      # from docker/config/ on first run of setup-ubuntu-host.sh.
      - /opt/libreclinica/config:/usr/local/tomcat/libreclinica.config:ro
      # DR-029: the unified ingest store (core.ingest.storePath). Compose merges
      # `volumes` by container path, so this overrides the base file's
      # ./docker/ingest bind with the same absolute host directory the
      # dicom-scp service mounts — the sidecar pseudonymises an uploaded .dcm
      # through this very bind, so the two must be one directory on the host.
      - /var/lib/libreclinica/ingest:/var/lib/libreclinica/ingest

  db:
    restart: unless-stopped
    environment:
      # The base compose hard-codes POSTGRES_PASSWORD=clinica which is
      # fine for dev. Production reads the host-generated secret from
      # /etc/libreclinica/env (see libreclinica.service EnvironmentFile).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
    volumes:
      # Replace the named volume with a stable host path so backups can
      # read it directly and disk-image snapshots are straightforward.
      # The setup script creates this dir owned by the libreclinica user.
      - /var/lib/libreclinica/postgres:/var/lib/postgresql/data

  retinal-inference:
    # Production pulls a pre-built image from ghcr.io rather than
    # building from source on the VM. Defaults to the same tag the app
    # uses so a single LIBRECLINICA_IMAGE_TAG roll moves both in
    # lockstep; an operator who needs to pin the sidecar independently
    # can set LIBRECLINICA_RETINAL_IMAGE_TAG in /etc/libreclinica/env.
    image: ghcr.io/luviku/libreclinicamuw/retinal-inference:${LIBRECLINICA_RETINAL_IMAGE_TAG:-${LIBRECLINICA_IMAGE_TAG:-latest}}
    pull_policy: always
    restart: unless-stopped
    environment:
      RETINAL_INFERENCE_ADAPTER: ${RETINAL_INFERENCE_ADAPTER:-placeholder}
      # The base compose.yaml hard-codes clinica:clinica in the DB URL, which
      # is the dev default. Production runs Postgres with the host-generated
      # secret (POSTGRES_PASSWORD from /etc/libreclinica/env, exposed to compose
      # via the systemd EnvironmentFile), so override the URL to use it. Harmless
      # for the placeholder adapter (no DB connection), but prevents an auth
      # failure the moment a real adapter that talks to Postgres lands.
      RETINAL_INFERENCE_DB_URL: postgresql://clinica:${POSTGRES_PASSWORD:-clinica}@db:5432/libreclinica
      # Per-task model-runner endpoints (used when RETINAL_INFERENCE_ADAPTER=optima).
      # Empty by default so prod stays on the placeholder until a runner image is
      # published + deployed (see retinal-inference/runners/). Set in
      # /etc/libreclinica/env when each runner service is rolled out.
      RETINAL_INFERENCE_RUNNER_FLUID_URL: ${RETINAL_INFERENCE_RUNNER_FLUID_URL:-}
      RETINAL_INFERENCE_RUNNER_ONL_URL: ${RETINAL_INFERENCE_RUNNER_ONL_URL:-}
      RETINAL_INFERENCE_RUNNER_PR_URL: ${RETINAL_INFERENCE_RUNNER_PR_URL:-}
      RETINAL_INFERENCE_RUNNER_GA_URL: ${RETINAL_INFERENCE_RUNNER_GA_URL:-}
      # DR-022 / DR-024 — the app-VM dispatch path needs the e2e→bscan.dcm
      # /preprocess endpoint served locally (the published image bundles the
      # muw-e2e-converter, so the same retinal-inference container can do it —
      # no separate retinal-preprocess service required in prod). The token
      # must match core.retinalInference.preprocessToken in datainfo.properties
      # (the setup script stamps both from LIBRECLINICA_RETINAL_PREPROCESS_TOKEN).
      RETINAL_INFERENCE_PREPROCESS_ENDPOINT_ENABLED: "true"
      RETINAL_INFERENCE_AUTH_TOKEN: ${RETINAL_INFERENCE_PREPROCESS_TOKEN:-cb2e7d0edd4d54cd8af46bbef78755a7}
      # Persist the per-source-scan companion files (bscan.dcm + fundus.png +
      # geometry.json) under the shared retinal-artifacts bind so the app's
      # viewer (core.retinalInference.artifactStorePath) can stream them back.
      RETINAL_INFERENCE_BSCAN_STORE: /var/lib/libreclinica/retinal-artifacts/bscans
    volumes:
      # Move the two retinal-inference bind mounts off the dev-tree
      # ./docker/ paths and onto /var/lib/libreclinica/ paths the setup
      # script creates and chowns to libreclinica:libreclinica.
      - /var/lib/libreclinica/retinal-inference:/var/lib/libreclinica/segmentation-output
      - /var/lib/libreclinica/e2e-uploads:/var/lib/libreclinica/e2e-uploads:ro
      # Shared artifact store — the SAME host dir the libreclinica service
      # binds at this target (base compose.yaml maps ./docker/retinal-artifacts
      # here), so the sidecar writes companions where the app reads them. Kept
      # on ./docker (not /var/lib) to match the app's existing bind; the dir is
      # git-ignored runtime data and survives `git reset` on setup re-runs.
      - ./docker/retinal-artifacts:/var/lib/libreclinica/retinal-artifacts
    # The base compose.yaml pins cpus: "4.0" for local dev boxes. The
    # production VM is a 2-CPU host, and Docker rejects a cpus limit above
    # the physical core count outright ("range of CPUs is from 0.01 to
    # 2.00"). Override down to a value that fits and still leaves headroom
    # for Postgres + the Tomcat app; the placeholder sidecar is near-idle.
    # Bump this if the sidecar is moved to a larger VM or a real model lands.
    cpus: "${LIBRECLINICA_RETINAL_CPUS:-1.5}"

  # DR-025 — DICOM receiver for the Optomed Lumo fundus camera. Behind the
  # `dicom` compose profile: set COMPOSE_PROFILES=dicom in
  # /etc/libreclinica/env on the host that serves a camera, and leave it
  # unset everywhere else.
  dicom-scp:
    image: ghcr.io/luviku/libreclinicamuw/dicom-scp:${LIBRECLINICA_DICOM_IMAGE_TAG:-${LIBRECLINICA_IMAGE_TAG:-latest}}
    pull_policy: always
    restart: unless-stopped
    # NOTE: no `ports:` here, deliberately — Compose concatenates port lists
    # across files, so a second entry would double-bind 11112 and publish
    # nothing. The bind address is owned by the base compose.yaml via
    # ${LIBRECLINICA_DICOM_BIND_ADDR}; production sets that to the
    # camera-facing address in /etc/libreclinica/env. A C-FIND against this
    # port returns subject labels, sex and dates of birth, so the campus
    # firewall rule admitting the camera VLAN alone is not optional.
    environment:
      DICOM_SCP_AE_TITLE: ${DICOM_SCP_AE_TITLE:-LIBRECLINICA}
      # The camera's own AE title. Leaving this blank accepts an association
      # from anything that can reach the port — set it.
      DICOM_SCP_ALLOWED_CALLING_AE_TITLES: ${DICOM_SCP_ALLOWED_CALLING_AE_TITLES:-}
      # Must equal core.dicom.ingest.token in datainfo.properties.
      DICOM_SCP_INGEST_TOKEN: ${DICOM_SCP_INGEST_TOKEN:-}
      # INFO keeps the per-association summary lines and suppresses
      # pynetdicom's dataset dumps, which would otherwise put PatientName
      # and PatientID into the container log.
      DICOM_SCP_LOG_LEVEL: ${DICOM_SCP_LOG_LEVEL:-INFO}
      # DR-029: describes and pseudonymises DICOM files that arrive through
      # the upload page. Internal to the compose network (no `ports:`); the
      # app reaches it at core.dicom.describe.url. 0 turns it off, which
      # turns DICOM uploads into a 503 — never into files stored as-is.
      DICOM_SCP_DESCRIBE_PORT: ${DICOM_SCP_DESCRIBE_PORT:-8081}
    volumes:
      # Stable host path under the backup root, like the other stores. The
      # app reads the same directory to serve image previews, so the two
      # binds must stay identical.
      - /var/lib/libreclinica/dicom-ingest:/var/lib/libreclinica/dicom-ingest
      # DR-029: the unified ingest store (core.ingest.storePath) the app writes
      # uploads to. Same bind in both containers — see the runbook, §7.
      - /var/lib/libreclinica/ingest:/var/lib/libreclinica/ingest
