# Per-deployment SERVER-level settings: INTERNAL deployment (the default).
# ecrf.conf includes this file inside the HTTPS server{} block as
# /etc/nginx/ecrf-edge.conf. internet-facing.conf is its internet-facing
# counterpart; compose picks one with LIBRECLINICA_NGINX_EDGE_CONF, and
# deploy/setup-ubuntu-host.sh sets that in internet-facing mode.
#
# Internal behaviour is exactly what it was before the edge hardening: the
# request-body limit below is the old server-level value; no timeouts or rate
# limits are set here. (empty.conf is the do-nothing default for the other two
# per-deployment includes, real-IP trust and the http-level catch-all server.)
client_max_body_size 1024m;
