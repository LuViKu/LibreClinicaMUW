# =============================================================================
# LibreClinicaMUW eCRF — nginx TLS reverse proxy + clean-URL router
# =============================================================================
# Mounted into the nginx sidecar at /etc/nginx/conf.d/default.conf (see
# deploy/compose.production.yaml). Terminates TLS for the institutional
# hostname and serves the SPA at clean root URLs.
#
# URL model:
#   - Browser hits https://ecrf.augen.meduniwien.ac.at/login  (clean root)
#   - The SPA is BUILT with vite base '/' (createWebHistory('/')), so the
#     router matches /login, /subjects/… and keeps them in the address bar.
#   - The WAR still physically serves the SPA under /LibreClinica/app/ and the
#     REST API + legacy JSP under /LibreClinica/…, so this config maps:
#       /assets/…        → :8080/LibreClinica/app/assets/…   (hashed bundles)
#       /LibreClinica/…  → :8080/LibreClinica/…              (API, JSP, actuator)
#       everything else  → :8080/LibreClinica/app/…          (SPA shell/routes;
#                                                             SpaForwardingConfig
#                                                             returns index.html)
#   - Old /LibreClinica/app/… bookmarks are 301'd to the clean path.
#
# The app is reachable ONLY through this proxy now (the root-based asset URLs
# can't resolve on a direct :8080/LibreClinica/app load). See ./README.md.
# =============================================================================

upstream libreclinica_app {
    server libreclinica:8080;
    keepalive 32;
}

# ---- HTTP → HTTPS ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ecrf.augen.meduniwien.ac.at vrc-lin-tasks.augen.meduniwien.ac.at;
    return 301 https://$host$request_uri;
}

# ---- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ecrf.augen.meduniwien.ac.at vrc-lin-tasks.augen.meduniwien.ac.at;

    # SAN cert covering both names (see deploy/nginx/README.md for the CSR).
    ssl_certificate     /etc/libreclinica/tls/ecrf-augen.crt;
    ssl_certificate_key /etc/libreclinica/tls/ecrf-augen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — 1 year. Leave commented until you've confirmed HTTPS is stable on
    # every path (an over-eager HSTS pin is hard to undo in browsers).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # OCT .e2e uploads run to ~200 MB (multi-volume scans); nginx defaults to 1 MB.
    client_max_body_size 1024m;

    # Forwarded headers so Tomcat's RemoteIpValve (see Dockerfile) reconstructs
    # the real scheme/host/IP → https URLs, Secure cookies, correct rate-limit IP.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    # The Tomcat session cookie is scoped to the /LibreClinica context path;
    # rewrite it to '/' so it rides along on the clean root URLs too.
    proxy_cookie_path /LibreClinica /;

    # ---- DR-025: internal device API is not for the internet ----------------
    # /api/v1/internal/ carries the DICOM worklist (subject labels, sex, dates
    # of birth for every scheduled visit) and the image-ingest sink. Both are
    # meant for the dicom-scp sidecar over the compose network and are gated
    # only by a shared secret — a secret in a camera's config screen, which is
    # not a credential anyone rotates. Refuse them at the edge so a leaked
    # token is not enough on its own.
    #
    # ^~ makes this a prefix match that wins over the /LibreClinica/ block
    # below, and 404 rather than 403 so the path does not confirm itself.
    location ^~ /LibreClinica/pages/api/v1/internal/ {
        return 404;
    }
    # Same endpoints reachable through the clean-URL root, which the catch-all
    # location would otherwise forward into the WAR.
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # ---- 2026-09-23: Optomed Client worklist file, for the USB-docked Lumo --
    # Unlike /internal/ above, this one must be reachable from the clinic PC
    # that runs the Optomed Client, so it is forwarded, not refused. It is safe
    # to forward because it carries less than the DICOM worklist (a placeholder
    # date of birth), has its own token, and is off (404) until
    # core.optomed.worklist.enabled=true in datainfo.properties.
    #
    # Defence in depth: once the clinic PC has a fixed address, restrict the
    # location to it and every other client gets the same 404 the disabled
    # state gives. Leave the allow-list commented until then — a wrong address
    # here looks exactly like the endpoint being switched off.
    location ^~ /LibreClinica/pages/api/v1/device/optomed/ {
        # allow 10.0.0.0/8;      # the clinic PC's address or subnet
        # deny  all;
        # error_page 403 =404 /404.html;
        proxy_pass         http://libreclinica:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- SSE: retinal job-status stream — unbuffered + long-lived ----------
    # Must precede the /LibreClinica/ prefix block (regex locations win). The
    # live job-view updates (SLO/OCT/segmentation) flow over this stream.
    location ~ ^/LibreClinica/pages/api/v1/retinal-jobs/[0-9]+/status/stream$ {
        proxy_pass http://libreclinica_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    # ---- Old SPA bookmarks: /LibreClinica/app/… → clean /… (301) -----------
    # More specific than the /LibreClinica/ block below, so browser hits to the
    # legacy SPA URLs are redirected. (Internal proxy_pass to /LibreClinica/app/
    # for assets/shell does NOT re-enter location matching, so no conflict.)
    location /LibreClinica/app/ {
        rewrite ^/LibreClinica/app/(.*)$ /$1 permanent;
    }

    # ---- REST API, legacy JSP, actuator, MainMenu — pass through as-is ------
    location /LibreClinica/ {
        proxy_pass http://libreclinica_app;
    }

    # ---- SPA hashed assets (built at base '/', served by the WAR under /app) -
    location /assets/ {
        proxy_pass http://libreclinica_app/LibreClinica/app/assets/;
    }

    # ---- Everything else = SPA clean routes → WAR SPA forwarder (index.html) -
    location / {
        proxy_pass http://libreclinica_app/LibreClinica/app/;
    }
}

# =============================================================================
# Retinal-inference cluster failover (internal listener, NOT published)
# =============================================================================
# The OCT models run on the OPTIMA GPU cluster, on nodes we do not control and
# that go away without warning. On 2026-09-03 the single configured node's
# server died; on 2026-09-22 the node itself (cn5) wedged at load 14000 and was
# marked DOWN by SLURM. Every OCT job in between failed with "Remote /run
# returned null" because core.retinalInference.remotePushUrl named exactly one
# host.
#
# Point remotePushUrl at this listener instead:
#     core.retinalInference.remotePushUrl=http://nginx:8088
#
# WHY IPs, NOT HOSTNAMES
#   nginx resolves upstream hostnames ONCE, at startup, and refuses to start if
#   resolution fails. This nginx is the front door for the whole eCRF, so a
#   flaky DNS entry for a GPU node would take the clinical app down with it.
#   Literal IPs cannot fail to resolve. The cost is editing this file if a node
#   is ever re-addressed, which is the cheaper failure by far.
#
# WHY NO RETRY IS CONFIGURED
#   /run is a POST, and nginx does not retry non-idempotent requests unless
#   `non_idempotent` is set — deliberately NOT set here. A retry after the
#   request was already accepted would start the SAME multi-minute GPU job on a
#   second card. Instead the failed POST returns null, RemoteRetinalInferenceClient
#   reverts the job to 'queued', and by the time the DB poll re-dispatches it
#   nginx has marked the dead node down and sends it to the backup. One wasted
#   attempt, no duplicate GPU work.
#
# NODE CONSTRAINT (load-bearing — see cluster-deployment.md §1a)
#   Only Turing-or-older GPUs can run the full task set. The `pr` container
#   (CUDA 10 / torch 0.4) and the `bm` venv (torch 1.8) carry no Ampere kernels
#   and fail with "no kernel image is available for execution on the device".
#   Both nodes below are 2080Ti. Do NOT substitute on2 (3080Ti), on4/on5
#   (A6000/A6000 Ada) or on1 (K80) without re-validating every task.
upstream retinal_cluster {
    server 149.148.108.144:8000 max_fails=2 fail_timeout=60s;  # on3  — 6x 2080Ti
    server 149.148.108.170:8000 backup;                        # cn6  — 4x 2080Ti
}

server {
    listen 8088;
    server_name _;

    # A bscan.dcm is ~50 MB; the .e2e path can be larger.
    client_max_body_size 1024m;

    # Fail over fast on a dead node, but wait out a live GPU job: a full-volume
    # segmentation runs for minutes, and a short read timeout would look
    # identical to an outage and poison the upstream's fail counter.
    proxy_connect_timeout 5s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    # No proxy_set_header for the auth token: nginx forwards client request
    # headers as-is, and X-MUW-Inference-Token is hyphenated, so it survives
    # (unlike an underscored name, which nginx would silently drop).
    location / {
        proxy_pass http://retinal_cluster;
    }
}
