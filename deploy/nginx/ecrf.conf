# =============================================================================
# LibreClinicaMUW eCRF — nginx TLS reverse proxy + clean-URL router
# =============================================================================
# Mounted into the nginx sidecar at /etc/nginx/conf.d/default.conf (see
# deploy/compose.production.yaml). Terminates TLS for the institutional
# hostname and serves the SPA at clean root URLs.
#
# URL model:
#   - Browser hits https://ecrf.augen.meduniwien.ac.at/login  (clean root)
#   - The SPA is BUILT with vite base '/' (createWebHistory('/')), so the
#     router matches /login, /subjects/… and keeps them in the address bar.
#   - The WAR still physically serves the SPA under /LibreClinica/app/ and the
#     REST API + legacy JSP under /LibreClinica/…, so this config maps:
#       /assets/…        → :8080/LibreClinica/app/assets/…   (hashed bundles)
#       /LibreClinica/…  → :8080/LibreClinica/…              (API, JSP, actuator)
#       everything else  → :8080/LibreClinica/app/…          (SPA shell/routes;
#                                                             SpaForwardingConfig
#                                                             returns index.html)
#   - Old /LibreClinica/app/… bookmarks are 301'd to the clean path.
#
# The app is reachable ONLY through this proxy now (the root-based asset URLs
# can't resolve on a direct :8080/LibreClinica/app load). See ./README.md.
#
# Edge hardening (2026-10, multicenter work): server_tokens off, Mozilla
# "intermediate" TLS, HSTS and security headers (both deployments), plus a
# per-deployment include chosen in compose: edge-none.conf (internal: nothing
# changes from the old behaviour) or internet-facing.conf (2m request body,
# short timeouts, rate limits, 404 for everything that must not be reachable
# from the internet, a default_server that refuses unknown Host/SNI).
# =============================================================================

# This file is included in nginx's http{} context, so these are global.
server_tokens off;

# http-level, per-deployment include (internet-facing: default_server catch-all
# that refuses unknown Host/SNI). Empty file on the internal deployment.
include /etc/nginx/ecrf-edge-http.conf;

# ---- Rate / connection limiting (zones are shared by every server below) ----
# Keyed on the client address as nginx sees it. Behind the MUW DMZ proxy that
# is the proxy's address unless the real-IP include is configured (see
# internet-facing.conf), so set that up before relying on the per-IP limits.
#
# The zones are defined for both deployments but only the internet-facing one
# is limited: the login and form zones are keyed by $lc_limit_key, which is
# empty (= not counted, never limited) unless $internet_facing is 1, and the
# general limit_req/limit_conn directives are in internet-facing.conf.
map $internet_facing $lc_limit_key {
    1       $binary_remote_addr;
    default "";
}
limit_req_zone  $lc_limit_key         zone=lc_login:10m   rate=20r/m;   # credential-taking
limit_req_zone  $lc_limit_key         zone=lc_form:10m    rate=6r/m;    # RequestAccount / Contact
limit_req_zone  $binary_remote_addr   zone=lc_general:20m rate=50r/s;   # everything else (the SPA is chatty)
limit_conn_zone $binary_remote_addr zone=lc_conn:10m;
limit_req_status     429;
limit_conn_status    429;
limit_req_log_level  warn;
limit_conn_log_level warn;

upstream libreclinica_app {
    server libreclinica:8080;
    keepalive 32;
}

# ---- HTTP → HTTPS ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ecrf.augen.meduniwien.ac.at vrc-lin-tasks.augen.meduniwien.ac.at;
    return 301 https://$host$request_uri;
}

# ---- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ecrf.augen.meduniwien.ac.at vrc-lin-tasks.augen.meduniwien.ac.at;

    # SAN cert covering both names (see deploy/nginx/README.md for the CSR).
    ssl_certificate     /etc/libreclinica/tls/ecrf-augen.crt;
    ssl_certificate_key /etc/libreclinica/tls/ecrf-augen.key;

    # Mozilla "intermediate" profile (TLS 1.2 + 1.3, AEAD ciphers only). For the
    # intermediate profile Mozilla recommends ssl_prefer_server_ciphers off, so
    # clients with AES hardware pick AES and the others pick ChaCha20.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Edge switches -------------------------------------------------------
    # $internet_facing is 0 here and flipped to 1 by deploy/nginx/internet-facing.conf
    # (included below; its `set` runs later and wins). The locations that exist
    # only for the internal deployment test it and 404 when it is 1.
    set $internet_facing 0;
    # HSTS. Port 80 only redirects, so both deployments are HTTPS-only and it
    # is on for both. includeSubDomains is added only by internet-facing.conf:
    # on the internal name it would also pin every *.meduniwien.ac.at sibling.
    set $hsts_value "max-age=31536000";

    # Optional per-deployment includes. Compose mounts an empty file at both
    # paths unless LIBRECLINICA_NGINX_EDGE_CONF / LIBRECLINICA_NGINX_REALIP_CONF
    # point elsewhere (see deploy/compose.production.yaml).
    include /etc/nginx/ecrf-realip.conf;
    include /etc/nginx/ecrf-edge.conf;

    add_header Strict-Transport-Security $hsts_value always;
    add_header Referrer-Policy           "same-origin" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # Deliberately NO script-src/style-src: the 400+ heritage JSPs use inline
    # scripts and handlers, and a restrictive policy would break them. These
    # three directives are the ones that cost nothing (nothing in the app is
    # framed, embeds a plug-in, or takes its <base> href from elsewhere).
    add_header Content-Security-Policy   "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # NB: a location inherits add_header only if it defines none of its own.
    # None do; keep it that way or repeat these lines there.

    # Request-size, timeout and rate limits are deliberately NOT set here: they
    # are what the two deployments differ on, and they live in the per-mode
    # include above, so exactly one file sets them:
    #   edge-none.conf       internal: client_max_body_size 1024m (as before),
    #                        nginx default timeouts, no rate limits
    #   internet-facing.conf client_max_body_size 2m, short timeouts, per-IP
    #                        request and connection limits
    # The upload locations below carry their own client_max_body_size.

    # Forwarded headers so Tomcat's RemoteIpValve (see Dockerfile) reconstructs
    # the real scheme/host/IP → https URLs, Secure cookies, correct rate-limit IP.
    # nginx is the first hop on this host, so X-Forwarded-For is SET to the
    # address nginx saw rather than appended to: a client-supplied
    # X-Forwarded-For must never reach the app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    # Empty Connection keeps the upstream keepalive pool usable (HTTP/1.1).
    # Set HERE, not per location: a location with any proxy_set_header of its
    # own drops every one of these, which once left the SSE location without
    # Host/X-Forwarded-* and would now leave it without the SSO strip below.
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # SSO identity headers (LIBRECLINICA_SSO_PRINCIPAL_HEADER / _EMAIL_HEADER /
    # _DISPLAY_NAME_HEADER defaults). They are meant to be set by a trusted SSO
    # proxy, never by a browser: blank them so a client cannot assert an
    # identity. (nginx already drops header names containing an underscore, so
    # REMOTE_USER could not arrive anyway; this is explicit and survives a
    # future underscores_in_headers on.) SSO is off on both deployments. If an
    # SSO proxy ever sits IN FRONT of this nginx and its headers must reach the
    # app, remove these three lines and rely on LIBRECLINICA_SSO_TRUSTED_CIDRS.
    proxy_set_header REMOTE_USER  "";
    proxy_set_header mail         "";
    proxy_set_header displayName  "";

    # The Tomcat session cookie is scoped to the /LibreClinica context path;
    # rewrite it to '/' so it rides along on the clean root URLs too.
    proxy_cookie_path /LibreClinica /;

    # ---- DR-025: internal device API is not for the internet ----------------
    # /api/v1/internal/ carries the DICOM worklist (subject labels, sex, dates
    # of birth for every scheduled visit) and the image-ingest sink. Both are
    # meant for the dicom-scp sidecar over the compose network and are gated
    # only by a shared secret — a secret in a camera's config screen, which is
    # not a credential anyone rotates. Refuse them at the edge so a leaked
    # token is not enough on its own.
    #
    # ^~ makes this a prefix match that wins over the /LibreClinica/ block
    # below, and 404 rather than 403 so the path does not confirm itself.
    location ^~ /LibreClinica/pages/api/v1/internal/ {
        return 404;
    }
    # Same endpoints reachable through the clean-URL root, which the catch-all
    # location would otherwise forward into the WAR.
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # ---- 2026-09-23: Optomed Client worklist file, for the USB-docked Lumo --
    # Unlike /internal/ above, this one must be reachable from the clinic PC
    # that runs the Optomed Client, so it is forwarded, not refused. It is safe
    # to forward because it carries less than the DICOM worklist (a placeholder
    # date of birth), has its own token, and is off (404) until
    # core.optomed.worklist.enabled=true in datainfo.properties.
    #
    # Defence in depth: once the clinic PC has a fixed address, restrict the
    # location to it and every other client gets the same 404 the disabled
    # state gives. Leave the allow-list commented until then — a wrong address
    # here looks exactly like the endpoint being switched off.
    #
    # The internet-facing deployment has no clinic PC behind it: 404 there.
    location ^~ /LibreClinica/pages/api/v1/device/optomed/ {
        if ($internet_facing) { return 404; }
        # allow 10.0.0.0/8;      # the clinic PC's address or subnet
        # deny  all;
        # error_page 403 =404 /404.html;
        proxy_pass         http://libreclinica:8080;
        proxy_read_timeout 30s;
    }

    # ---- Login / credential-taking / unauthenticated form routes ------------
    # Own request-rate zones (brute force, mail-bomb via Contact/RequestAccount).
    # The SPA login POSTs j_spring_security_check (web/src/spa/src/stores/auth.ts).
    # Regex locations, so a `;param` suffix does not slip past an exact match.
    location ~ "^/LibreClinica/j_spring_security_check(;|$)" {
        limit_req zone=lc_login burst=10 nodelay;
        proxy_pass http://libreclinica_app;
    }
    location ~ "^/LibreClinica/(RequestAccount|Contact|pages/api/v1/contact)(;|/|$)" {
        limit_req zone=lc_form burst=5 nodelay;
        proxy_pass http://libreclinica_app;
    }

    # ---- Uploads: the ONLY locations allowed a large request body -----------
    # Everything else gets the per-mode server-level limit (1024m internal, 2m
    # internet-facing; see the include). The app itself caps the
    # /pages/* multipart parser at 200 MiB (web.xml); the OCT/ingest routes keep
    # the 1024m this file always had so behaviour there does not change.
    #
    #  1 GiB  public portals (internal deployment; 404 on internet-facing)
    #         /LibreClinica/pages/api/v1/public/{upload,oct-upload,image-upload}/commit
    location ^~ /LibreClinica/pages/api/v1/public/ {
        if ($internet_facing) { return 404; }
        client_max_body_size 1024m;
        proxy_pass http://libreclinica_app;
    }
    #  1 GiB  authenticated ingest upload (SPA /ingest-inbox/upload)
    location ^~ /LibreClinica/pages/api/v1/ingest/upload/ {
        client_max_body_size 1024m;
        proxy_pass http://libreclinica_app;
    }
    #  1 GiB  authenticated OCT (.e2e) upload on an event CRF
    location ~ ^/LibreClinica/pages/api/v1/event-crfs/[0-9]+/oct-upload$ {
        client_max_body_size 1024m;
        proxy_pass http://libreclinica_app;
    }
    #  200 MiB  CRF file-item upload (CrfFileStorageService enforces its own cap)
    location ~ ^/LibreClinica/pages/api/v1/eventCrfs/[0-9]+/items/[^/]+/file$ {
        client_max_body_size 200m;
        proxy_pass http://libreclinica_app;
    }
    #  200 MiB  CRF version spreadsheet, ODM data import, rule-set import (SPA)
    location ~ ^/LibreClinica/pages/api/v1/(crfs/[^/]+/versions|import|rules/import)$ {
        client_max_body_size 200m;
        proxy_pass http://libreclinica_app;
    }
    #  200 MiB  legacy multipart JSP forms (spreadsheet / ODM / rules / file upload)
    location ~ ^/LibreClinica/(CreateCRFVersion|CreateXformCRFVersion|ImportCRFData|ImportRule|UploadFile)$ {
        client_max_body_size 200m;
        proxy_pass http://libreclinica_app;
    }

    # ---- SSE: retinal job-status stream — unbuffered + long-lived ----------
    # Must precede the /LibreClinica/ prefix block (regex locations win). The
    # live job-view updates (SLO/OCT/segmentation) flow over this stream.
    # Connection '' and the forwarded headers come from the server level.
    location ~ ^/LibreClinica/pages/api/v1/retinal-jobs/[0-9]+/status/stream$ {
        proxy_pass http://libreclinica_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- Old SPA bookmarks: /LibreClinica/app/… → clean /… (301) -----------
    # More specific than the /LibreClinica/ block below, so browser hits to the
    # legacy SPA URLs are redirected. (Internal proxy_pass to /LibreClinica/app/
    # for assets/shell does NOT re-enter location matching, so no conflict.)
    location /LibreClinica/app/ {
        rewrite ^/LibreClinica/app/(.*)$ /$1 permanent;
    }

    # ---- REST API, legacy JSP, actuator, MainMenu — pass through as-is ------
    location /LibreClinica/ {
        proxy_pass http://libreclinica_app;
    }

    # ---- SPA hashed assets (built at base '/', served by the WAR under /app) -
    location /assets/ {
        proxy_pass http://libreclinica_app/LibreClinica/app/assets/;
    }

    # ---- Everything else = SPA clean routes → WAR SPA forwarder (index.html) -
    location / {
        proxy_pass http://libreclinica_app/LibreClinica/app/;
    }
}

# =============================================================================
# Retinal-inference cluster failover (internal listener, NOT published)
# =============================================================================
# The OCT models run on the OPTIMA GPU cluster, on nodes we do not control and
# that go away without warning. On 2026-09-03 the single configured node's
# server died; on 2026-09-22 the node itself (cn5) wedged at load 14000 and was
# marked DOWN by SLURM. Every OCT job in between failed with "Remote /run
# returned null" because core.retinalInference.remotePushUrl named exactly one
# host.
#
# Point remotePushUrl at this listener instead:
#     core.retinalInference.remotePushUrl=http://nginx:8088
#
# WHY IPs, NOT HOSTNAMES
#   nginx resolves upstream hostnames ONCE, at startup, and refuses to start if
#   resolution fails. This nginx is the front door for the whole eCRF, so a
#   flaky DNS entry for a GPU node would take the clinical app down with it.
#   Literal IPs cannot fail to resolve. The cost is editing this file if a node
#   is ever re-addressed, which is the cheaper failure by far.
#
# WHY NO RETRY IS CONFIGURED
#   /run is a POST, and nginx does not retry non-idempotent requests unless
#   `non_idempotent` is set — deliberately NOT set here. A retry after the
#   request was already accepted would start the SAME multi-minute GPU job on a
#   second card. Instead the failed POST returns null, RemoteRetinalInferenceClient
#   reverts the job to 'queued', and by the time the DB poll re-dispatches it
#   nginx has marked the dead node down and sends it to the backup. One wasted
#   attempt, no duplicate GPU work.
#
# NODE CONSTRAINT (load-bearing — see cluster-deployment.md §1a)
#   Only Turing-or-older GPUs can run the full task set. The `pr` container
#   (CUDA 10 / torch 0.4) and the `bm` venv (torch 1.8) carry no Ampere kernels
#   and fail with "no kernel image is available for execution on the device".
#   Both nodes below are 2080Ti. Do NOT substitute on2 (3080Ti), on4/on5
#   (A6000/A6000 Ada) or on1 (K80) without re-validating every task.
upstream retinal_cluster {
    server 149.148.108.144:8000 max_fails=2 fail_timeout=60s;  # on3  — 6x 2080Ti
    server 149.148.108.170:8000 backup;                        # cn6  — 4x 2080Ti
}

server {
    listen 8088;
    server_name _;

    # A bscan.dcm is ~50 MB; the .e2e path can be larger.
    client_max_body_size 1024m;

    # Fail over fast on a dead node, but wait out a live GPU job: a full-volume
    # segmentation runs for minutes, and a short read timeout would look
    # identical to an outage and poison the upstream's fail counter.
    proxy_connect_timeout 5s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    # No proxy_set_header for the auth token: nginx forwards client request
    # headers as-is, and X-MUW-Inference-Token is hyphenated, so it survives
    # (unlike an underscored name, which nginx would silently drop).
    location / {
        proxy_pass http://retinal_cluster;
    }
}
