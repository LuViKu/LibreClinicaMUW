# =============================================================================
# Internet-facing deployment: what must NOT be reachable from the internet
# =============================================================================
# Included inside the HTTPS server{} block of ecrf.conf, and only on the
# internet-facing host (deploy/setup-ubuntu-host.sh with INTERNET_FACING=true
# sets LIBRECLINICA_NGINX_EDGE_CONF to this file in /etc/libreclinica/env; the
# internal deployment mounts an empty file instead). It is paired with the
# app-side switch LIBRECLINICA_DEPLOYMENT_INTERNET_FACING=true, which disables
# the same endpoints inside the application. Both layers are meant to be on;
# either alone keeps these paths closed.
#
# Everything answers 404, not 403: the path should not confirm itself.
#
# How the matching is built
#   * nginx matches locations against the NORMALISED path ($uri: percent
#     decoding done, "//" merged, "." / ".." resolved). It does NOT strip
#     ";param" path parameters, but Tomcat does, per path segment. So
#     /LibreClinica/pages/api/v1/public;x=1/upload/ is a different path to
#     nginx and the same path to the app. Rule 1 closes that whole class.
#   * ^~ prefix locations in ecrf.conf (public/, internal/, device/optomed/)
#     outrank the regexes here; they test $internet_facing themselves (the
#     `set` below). The regexes are the net underneath, and the only guard
#     for the paths ecrf.conf has no location for.
#   * Regexes are case-insensitive (~*). Tomcat is case-sensitive, so a
#     differently-cased path would 404 in the app anyway; this is belt and braces.
#
# Real client addresses and rate limits
#   Behind the MUW DMZ proxy every request arrives from the proxy's address,
#   so the per-IP limits in ecrf.conf would throttle all users together.
#   The setup script writes /etc/libreclinica/nginx-realip.conf from
#   DMZ_PROXY_CIDRS (set_real_ip_from ...; real_ip_header X-Forwarded-For) and
#   points LIBRECLINICA_NGINX_REALIP_CONF at it. The DMZ proxy must APPEND the
#   client address to X-Forwarded-For and be the only host that can reach this
#   VM's 443 (the host firewall enforces this when DMZ_PROXY_CIDRS is set).
# =============================================================================

set $internet_facing 1;
set $hsts_value "max-age=31536000; includeSubDomains";

# ---- 1. Path-parameter smuggling ------------------------------------------
# Any ";" in the path except Tomcat's own ";jsessionid=" is refused. No SPA
# route or API path uses a semicolon. (Spring Security's StrictHttpFirewall
# rejects semicolons in the app as well; this keeps the request off the
# application entirely.)
location ~* ";(?!jsessionid=)" {
    return 404;
}

# ---- 2. Operational, documentation, device and public API surfaces --------
#   actuator              health/metrics/prometheus (Prometheus is internal)
#   v3 / swagger-ui       OpenAPI spec and Swagger UI, both prefixes
#   pages/auth/           heritage OpenClinica REST ("auth" in name only; it is
#                         permitAll in the app: study/CRF import, forms migrate)
#   api/vN/public/        unauthenticated upload / BCVA portals
#   api/vN/internal/      DICOM ingest + worklist (sidecar only)
#   api/vN/device/        Optomed worklist, uploader heartbeats
#   api/vN/anonymousform  heritage unauthenticated form endpoint
# The SPA calls none of these except the public portals (which are the point).
location ~* ^/LibreClinica/(actuator|v3|swagger-ui|pages/(v3|swagger-ui|auth|api/v[0-9]+/(public|internal|device|anonymousform)))(/|\.|$) {
    return 404;
}

# ---- 3. Clean-URL twins ----------------------------------------------------
# ecrf.conf forwards unknown clean paths to the SPA forwarder, which answers
# with index.html; refuse the API prefixes rather than serve an HTML 200 there.
location ~* ^/api/v[0-9]+/(public|internal|device|anonymousform)(/|$) {
    return 404;
}

# ---- 4. Public portal PAGES (SPA routes with meta.public = true) -----------
# /upload, /oct-upload, /image-upload and /bcva-entry/:studyOid. Anchored at
# the root, so the AUTHENTICATED /ingest-inbox/upload is not touched. The
# legacy /LibreClinica/app/ spelling is included so it 404s instead of
# 301-ing to a 404. /login, /contact, /first-login, /change-password and the
# rest of the router are unaffected (see web/src/spa/src/router/index.ts).
location ~* ^/(LibreClinica/app/)?(upload|oct-upload|image-upload|bcva-entry)(/|$) {
    return 404;
}

# ---- Optional: further heritage endpoints --------------------------------
# permitAll in SecurityConfig and not used by the SPA. Closed by the app-side
# switch; uncomment to close them at the edge too once nothing on the
# deployment depends on them (SOAP web services, OpenRosa/XForm submissions,
# ODM/ItemData/healthcheck dispatcher paths).
