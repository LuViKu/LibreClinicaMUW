# http-level include for the INTERNET-FACING deployment (ecrf.conf includes it as
# /etc/nginx/ecrf-edge-http.conf, outside any server block).
#
# Catch-all default servers: a request whose Host (port 80) or SNI (port 443)
# is not one of the names in ecrf.conf is refused instead of being answered by
# the eCRF. Port 443 refuses the TLS handshake itself (no certificate is
# presented, so nothing is learned from the certificate either); port 80 closes
# the connection without a response (444). The DMZ proxy must therefore send
# the public name as both SNI and Host header.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
