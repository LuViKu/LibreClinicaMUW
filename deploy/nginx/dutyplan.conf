# =============================================================================
# DutyPlan — a separate app on this VM, behind the eCRF nginx (DR-038)
# =============================================================================
# Public name einteilung.augen.meduniwien.ac.at; the app and its container are
# called DutyPlan. It runs as its own compose project and is reached over the external
# docker network "edge" as dutyplan:8000. setup-ubuntu-host.sh copies this file
# to /etc/libreclinica/nginx-sites/ only once einteilung-augen.crt and .key
# exist, so a missing certificate can never keep the eCRF's nginx from starting.
# Nothing here touches the ecrf.augen… / vrc-lin-tasks… server blocks.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name einteilung.augen.meduniwien.ac.at;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name einteilung.augen.meduniwien.ac.at;

    ssl_certificate     /etc/libreclinica/tls/einteilung-augen.crt;
    ssl_certificate_key /etc/libreclinica/tls/einteilung-augen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Resolve "dutyplan" per request through Docker's embedded DNS, not at
    # startup: nginx refuses to start when an upstream name does not resolve.
    # With a variable, a stopped DutyPlan only yields 502 on this hostname.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $dutyplan_upstream http://dutyplan:8000;

    location / {
        # A variable without a URI part forwards the request URI unchanged.
        proxy_pass         $dutyplan_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # DutyPlan's session cookie is Secure; uvicorn trusts this header.
        proxy_set_header   X-Forwarded-Proto https;
    }
}
