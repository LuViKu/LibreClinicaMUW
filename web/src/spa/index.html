<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibreClinica MUW</title>
    <meta name="description" content="LibreClinica MUW — clinical study data platform for the Department of Ophthalmology and Optometry, Medical University of Vienna." />
    <!-- 2026-06-29 — MUW-branded favicon + PWA icon set (commissioned).
         The SVG renders on modern browsers; PNG fallbacks for legacy
         tabs + Apple Home Screen + Android installable PWA.
         Hrefs are bare-leading-slash so Vite prepends the configured
         base (/LibreClinica/app/) automatically — adding the prefix
         here would double it (/LibreClinica/app/LibreClinica/app/…). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111d4e" />
    <!--
      nAMD workspace (and Phase E design system at large) — load MUW
      typeface stack from Google Fonts. Newsreader ≈ MUW Danton serif
      for branding accents; Inter ≈ MUW Akkurat Pro for body / UI;
      JetBrains Mono for OIDs + SQL-like keys. style.css's @theme block
      already references these family names via --font-{serif,sans,mono}.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
