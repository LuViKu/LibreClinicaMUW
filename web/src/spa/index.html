<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibreClinica MUW</title>
    <meta name="description" content="LibreClinica MUW — clinical study data platform for the Department of Ophthalmology and Optometry, Medical University of Vienna." />
    <!-- 2026-06-29 — MUW-branded favicon + PWA icon set (commissioned).
         The SVG renders on modern browsers; PNG fallbacks for legacy
         tabs + Apple Home Screen + Android installable PWA.
         Hrefs are bare-leading-slash so Vite prepends the configured
         base (/LibreClinica/app/) automatically — adding the prefix
         here would double it (/LibreClinica/app/LibreClinica/app/…). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111d4e" />
    <!--
      2026-07-06 — MUW typeface stack (Newsreader ≈ Danton serif for
      branding, Inter ≈ Akkurat Pro for UI, JetBrains Mono for OIDs)
      is bundled at build time via @fontsource-variable/* — see
      src/main.ts. Clinical-environment requirement: no runtime CDN
      fetches so we don't leak the operator's IP/Referer to third
      parties and keep the SPA typography working on CDN-blocked
      MUW networks. style.css's @font-face aliases pick the bundled
      files up automatically.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
